        detail-type:
          - BaggageRegistered
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationsQueue.Arn

  FlightScheduleUpdatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-flight-schedule-updated-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
        source:
          - flight-service
        detail-type:
          - FlightScheduleUpdated
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationsQueue.Arn

  PricingRecalculationScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-pricing-recalculation-schedule'
      ScheduleExpression: 'rate(5 minutes)'
      State: ENABLED
      Targets:
        - Id: pricing-lambda
          Arn: !GetAtt PricingRecalculationFunction.Arn

  # ============================================================
  # SQS Queues
  # ============================================================
  NotificationsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${EnvironmentName}-aerolink-notifications-dlq'
      MessageRetentionPeriod: 1209600

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${EnvironmentName}-aerolink-notifications'
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationsDLQ.Arn
        maxReceiveCount: 3

  NotificationsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt BookingCreatedRule.Arn
                  - !GetAtt PaymentCompletedRule.Arn
                  - !GetAtt PaymentFailedRule.Arn
                  - !GetAtt PaymentRefundedRule.Arn
                  - !GetAtt CheckInCompletedRule.Arn
                  - !GetAtt BaggageStatusChangedRule.Arn
                  - !GetAtt BaggageRegisteredRule.Arn
                  - !GetAtt BookingCancelledRule.Arn
                  - !GetAtt FlightScheduleUpdatedRule.Arn

  # ============================================================
  # S3 Bucket
  # ============================================================
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${EnvironmentName}-aerolink-documents-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionBoardingPassesToIA
            Prefix: boarding-passes/
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA

  # ============================================================
  # DynamoDB
  # ============================================================
  PaymentIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: payment-idempotency
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ============================================================
  # Lambda Functions
  # ============================================================

  # --- Lambda 1: Notification Dispatch (SQS-triggered) ---
  NotificationDispatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-notification-dispatch'
      Runtime: python3.10
      Handler: handler.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/notification_dispatch.zip
      Environment:
        Variables:
          AWS_DEFAULT_REGION_OVERRIDE: !Ref 'AWS::Region'
      LoggingConfig:
        LogGroup: !Ref NotificationDispatchLogGroup

  NotificationDispatchEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref NotificationDispatchFunction
      EventSourceArn: !GetAtt NotificationsQueue.Arn
      BatchSize: 10
      Enabled: false  # notification-service ECS task polls SQS directly; Lambda trigger disabled to avoid double-processing

  # --- Lambda 2: Boarding Pass Generator (EventBridge-triggered) ---
  BoardingPassGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-boarding-pass-generator'
      Runtime: python3.10
      Handler: handler.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/boarding_pass_generator.zip
      Environment:
        Variables:
          S3_BUCKET: !Ref DocumentsBucket
          AWS_DEFAULT_REGION_OVERRIDE: !Ref 'AWS::Region'
      LoggingConfig:
        LogGroup: !Ref BoardingPassGeneratorLogGroup

  BoardingPassLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BoardingPassGeneratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CheckInCompletedRule.Arn

  # --- Lambda 3: Pricing Recalculation (scheduled, VPC-attached) ---
  PricingRecalculationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-pricing-recalculation'
      Runtime: python3.10
      Handler: handler.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/pricing_recalculation.zip
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          DB_HOST: !GetAtt DBInstance.Endpoint.Address
          DB_PORT: !GetAtt DBInstance.Endpoint.Port
          DB_NAME: aerolink
          DB_USER: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
      LoggingConfig:
        LogGroup: !Ref PricingRecalculationLogGroup

  PricingRecalculationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PricingRecalculationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PricingRecalculationScheduleRule.Arn

# ============================================================
# Outputs
# ============================================================
Outputs:
  VPCId:
    Description: VPC identifier
    Value: !Ref VPC
    Export:
      Name: !Sub '${EnvironmentName}-VPCId'

  ApiGatewayEndpoint:
    Description: Public HTTPS endpoint for the AeroLink API (API Gateway invoke URL)
    Value: !Sub 'https://${AeroLinkHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${EnvironmentName}-ApiGatewayEndpoint'

  InternalALBDNSName:
    Description: Internal ALB DNS name (not publicly reachable; accessed via VPC Link)
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-InternalALBDNSName'

  RDSEndpoint:
    Description: PostgreSQL RDS endpoint address
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-RDSEndpoint'

  RedisEndpoint:
    Description: ElastiCache Redis primary endpoint
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-RedisEndpoint'

  EventBusArn:
    Description: EventBridge bus ARN
    Value: !GetAtt AerolinkEventBus.Arn
    Export:
      Name: !Sub '${EnvironmentName}-EventBusArn'

  NotificationsQueueUrl:
    Description: SQS notifications queue URL
    Value: !Ref NotificationsQueue
    Export:
      Name: !Sub '${EnvironmentName}-NotificationsQueueUrl'

  NotificationsQueueArn:
    Description: SQS notifications queue ARN
    Value: !GetAtt NotificationsQueue.Arn

  DocumentsBucketName:
    Description: S3 bucket for boarding passes and documents
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub '${EnvironmentName}-DocumentsBucket'

  PaymentIdempotencyTableName:
    Description: DynamoDB payment idempotency table
    Value: !Ref PaymentIdempotencyTable

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ECSCluster'

  ServiceDiscoveryNamespaceId:
    Description: Cloud Map namespace ID
    Value: !Ref ServiceDiscoveryNamespace

  ServiceDiscoveryNamespaceName:
    Description: Cloud Map namespace DNS name
    Value: aerolink.local
