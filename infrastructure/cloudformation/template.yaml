      Name: !Sub '${EnvironmentName}-payment-failed-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
        source:
          - payment-service
        detail-type:
          - PaymentFailed
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationsQueue.Arn

  PaymentRefundedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-payment-refunded-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
