  # ============================================================
  # EventBridge
  # ============================================================
  AerolinkEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: aerolink-events

  BookingCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-booking-created-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
        source:
          - booking-service
        detail-type:
          - BookingCreated
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationsQueue.Arn

  PaymentCompletedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-payment-completed-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
        source:
          - payment-service
        detail-type:
          - PaymentCompleted
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationsQueue.Arn

  CheckInCompletedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-checkin-completed-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
        source:
          - checkin-service
        detail-type:
          - CheckInCompleted
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationsQueue.Arn
        - Id: boarding-pass-lambda
          Arn: !GetAtt BoardingPassGeneratorFunction.Arn

  BaggageStatusChangedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-baggage-status-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
        source:
