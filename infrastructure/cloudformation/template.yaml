  # ============================================================
  # S3 cross-region replication
  # ============================================================

  # IAM role that S3 uses to replicate objects to the secondary region
  S3ReplicationRole:
    Type: AWS::IAM::Role
    Condition: IsPrimary
    Properties:
      RoleName: !Sub '${EnvironmentName}-s3-replication-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReplicationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetReplicationConfiguration
                  - s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObjectVersionForReplication
                  - s3:GetObjectVersionAcl
                  - s3:GetObjectVersionTagging
                Resource: !Sub '${DocumentsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ReplicateObject
                  - s3:ReplicateDelete
                  - s3:ReplicateTags
                Resource: !Sub 'arn:aws:s3:::${EnvironmentName}-aerolink-documents-replica-${AWS::AccountId}/*'

  # Replica bucket lives in the secondary region — deployed by the secondary stack
  DocumentsReplicaBucket:
    Type: AWS::S3::Bucket
    Condition: IsSecondary
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${EnvironmentName}-aerolink-documents-replica-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled   # versioning required for replication destination
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # Frontend S3 bucket + CloudFront distribution
  # ============================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-aerolink-frontend-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${EnvironmentName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${EnvironmentName} AeroLink frontend + API CDN'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If
          - HasDomain
          - - !Ref DomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCert
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        Origins:
          # Origin 1: S3 frontend SPA
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt FrontendBucketOAC.Id
          # Origin 2: API (via Global Accelerator → public ALB → ECS)
          - Id: api-origin
            DomainName: !GetAtt PublicALB.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
        CacheBehaviors:
          # API calls bypass cache entirely
          - PathPattern: '/api/*'
            TargetOriginId: api-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
        CustomErrorResponses:
          # SPA routing — serve index.html for all 403/404s
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-aerolink-cdn'

  # ============================================================
  # AWS Global Accelerator (primary region only — global resource)
  # ============================================================
  GlobalAccelerator:
    Type: AWS::GlobalAccelerator::Accelerator
    Condition: IsPrimary
    Properties:
      Name: !Sub '${EnvironmentName}-aerolink-ga'
      Enabled: true
      IpAddressType: IPV4
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-aerolink-ga'

  GlobalAcceleratorListener:
    Type: AWS::GlobalAccelerator::Listener
    Condition: IsPrimary
    Properties:
      AcceleratorArn: !Ref GlobalAccelerator
      Protocol: TCP
      PortRanges:
        - FromPort: 443
          ToPort: 443
        - FromPort: 80
          ToPort: 80

  # Primary endpoint group — contains the primary region ALB
  # Add SecondaryALBArn parameter after secondary stack is deployed to add the second endpoint
  GlobalAcceleratorEndpointGroup:
    Type: AWS::GlobalAccelerator::EndpointGroup
    Condition: IsPrimary
    Properties:
      ListenerArn: !Ref GlobalAcceleratorListener
      EndpointGroupRegion: !Ref PrimaryRegion
      TrafficDialPercentage: 100
      HealthCheckProtocol: HTTPS
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      ThresholdCount: 3
      EndpointConfigurations:
        - !If
          - HasSecondaryALB
          - EndpointId: !Ref SecondaryALBArn
            Weight: 50
            ClientIPPreservationEnabled: true
          - !Ref AWS::NoValue
        - EndpointId: !GetAtt PublicALB.LoadBalancerArn
          Weight: 50
          ClientIPPreservationEnabled: true

  # ============================================================
  # Route 53 — health checks + failover alias records
  # ============================================================
  PrimaryHealthCheck:
    Type: AWS::Route53::HealthCheck
    Condition: HasDomain
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !GetAtt PublicALB.DNSName
        ResourcePath: /health
        Port: 443
        RequestInterval: 10
        FailureThreshold: 3
      HealthCheckTags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-primary-health-check'

  Route53FailoverRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      SetIdentifier: !Sub '${EnvironmentName}-${AWS::Region}'
      Failover: !If [IsPrimary, PRIMARY, SECONDARY]
      HealthCheckId: !Ref PrimaryHealthCheck
      AliasTarget:
        # Primary: alias to Global Accelerator; Secondary: alias to regional PublicALB
        DNSName: !If
          - IsPrimary
          - !GetAtt GlobalAccelerator.DnsName
          - !GetAtt PublicALB.DNSName
        EvaluateTargetHealth: true
        HostedZoneId: !If
          - IsPrimary
          - Z2BJ6XQ5FK7U4H   # Global Accelerator hosted zone ID (fixed value)
          - !GetAtt PublicALB.CanonicalHostedZoneID

  # ============================================================
  # AWS WAF — rate-based per-IP limiting for API Gateway
  # ============================================================
  # HTTP API v2 stage throttling (ThrottlingRateLimit/BurstLimit) enforces
  # a global per-stage ceiling. WAF rate-based rules add per-source-IP
  # enforcement, replacing the old in-memory rate limiter in the custom
  # api-gateway service (which broke under horizontal scaling).
  WafWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${EnvironmentName}-aerolink-waf'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${EnvironmentName}AerolinkWaf'
      Rules:
        - Name: RateLimitPerIP
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 500        # requests per 5-minute window per IP (~100 req/min)
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${EnvironmentName}RateLimitPerIP'
        - Name: RateLimitPartnerApiKey
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 5000       # higher ceiling for x-api-key holders (~1000 req/min)
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader:
                      Name: x-api-key
                  PositionalConstraint: EXISTS
                  SearchString: ''
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub '${EnvironmentName}RateLimitPartnerApiKey'

  WafWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: HttpApiDefaultStage
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/${AeroLinkHttpApi}/stages/$default'
      WebACLArn: !GetAtt WafWebAcl.Arn

# ============================================================
# Outputs
# ============================================================
Outputs:
  VPCId:
    Description: VPC identifier
    Value: !Ref VPC
    Export:
      Name: !Sub '${EnvironmentName}-VPCId'

  ApiGatewayEndpoint:
    Description: Public HTTPS endpoint for the AeroLink API (API Gateway invoke URL)
    Value: !Sub 'https://${AeroLinkHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${EnvironmentName}-ApiGatewayEndpoint'

  InternalALBDNSName:
    Description: Internal ALB DNS name (not publicly reachable; accessed via VPC Link)
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-InternalALBDNSName'

  RDSEndpoint:
    Description: PostgreSQL RDS endpoint address
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-RDSEndpoint'

  RedisEndpoint:
    Description: ElastiCache Redis primary endpoint
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-RedisEndpoint'

  EventBusArn:
    Description: EventBridge bus ARN
    Value: !GetAtt AerolinkEventBus.Arn
    Export:
      Name: !Sub '${EnvironmentName}-EventBusArn'

  NotificationsQueueUrl:
    Description: SQS notifications queue URL
    Value: !Ref NotificationsQueue
    Export:
      Name: !Sub '${EnvironmentName}-NotificationsQueueUrl'

  NotificationsQueueArn:
    Description: SQS notifications queue ARN
    Value: !GetAtt NotificationsQueue.Arn

  DocumentsBucketName:
    Description: S3 bucket for boarding passes and documents
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub '${EnvironmentName}-DocumentsBucket'

  PaymentIdempotencyTableName:
    Description: DynamoDB payment idempotency table
    Value: !Ref PaymentIdempotencyTable

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ECSCluster'

  ServiceDiscoveryNamespaceId:
    Description: Cloud Map namespace ID
    Value: !Ref ServiceDiscoveryNamespace

  ServiceDiscoveryNamespaceName:
    Description: Cloud Map namespace DNS name
    Value: aerolink.local

  CognitoUserPoolId:
    Description: Cognito User Pool ID — set as COGNITO_USER_POOL_ID in services
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${EnvironmentName}-CognitoUserPoolId'

  CognitoUserPoolClientId:
    Description: Cognito App Client ID — set as COGNITO_CLIENT_ID in services
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${EnvironmentName}-CognitoUserPoolClientId'

  CognitoHostedUIUrl:
    Description: Cognito Hosted UI base URL for OAuth login/logout flows
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${EnvironmentName}-CognitoHostedUIUrl'

  CognitoIssuerUrl:
    Description: Cognito token issuer URL (used for JWKS discovery)
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'

  PublicALBDNSName:
    Description: Internet-facing ALB DNS name (target for Global Accelerator)
    Value: !GetAtt PublicALB.DNSName
    Export:
      Name: !Sub '${EnvironmentName}-PublicALBDNSName'

  PublicALBArn:
    Description: Internet-facing ALB ARN — pass as SecondaryALBArn when updating primary stack
    Value: !GetAtt PublicALB.LoadBalancerArn
    Export:
      Name: !Sub '${EnvironmentName}-PublicALBArn'

  CloudFrontDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub '${EnvironmentName}-CloudFrontDomain'

  GlobalAcceleratorDNS:
    Condition: IsPrimary
    Description: Global Accelerator anycast DNS name — use as CNAME or Route 53 alias target
    Value: !GetAtt GlobalAccelerator.DnsName
    Export:
      Name: !Sub '${EnvironmentName}-GlobalAcceleratorDNS'

  FrontendBucketName:
    Description: S3 bucket for the frontend SPA — deploy built assets here
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${EnvironmentName}-FrontendBucket'

  RDSReadReplicaEndpoint:
    Condition: IsSecondary
    Description: Read replica RDS endpoint (secondary region)
    Value: !GetAtt DBReadReplica.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-RDSReadReplicaEndpoint'

  WafWebAclArn:
    Description: WAF WebACL ARN — associate with CloudFront or additional API stages as needed
    Value: !GetAtt WafWebAcl.Arn
    Export:
      Name: !Sub '${EnvironmentName}-WafWebAclArn'
