            Retries: 3
            StartPeriod: 60

  # --- Notification Service (port 8008) ---
  NotificationServiceTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-notification-service'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref ECSTaskCPU
      Memory: !Ref ECSTaskMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: notification-service
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/aerolink/notification-service:${ContainerImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 8008
              Protocol: tcp
              Name: http
          Environment:
            - Name: SERVICE_NAME
              Value: notification-service
            - Name: DATABASE_URL
              Value: !Sub 'postgresql+asyncpg://${DBUsername}:${DBPassword}@${DBInstance.Endpoint.Address}:${DBInstance.Endpoint.Port}/aerolink'
            - Name: REDIS_URL
              Value: !Sub 'redis://${RedisReplicationGroup.PrimaryEndPoint.Address}:${RedisReplicationGroup.PrimaryEndPoint.Port}/7'
            - Name: JWT_SECRET
              Value: !Ref JWTSecret
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
            - Name: EVENT_BUS_NAME
              Value: aerolink-events
            - Name: ENABLE_SQS_POLLING
              Value: 'true'
            - Name: SQS_QUEUE_URL
              Value: !Ref NotificationsQueue
            - Name: SQS_DLQ_URL
              Value: !Ref NotificationsDLQ
            - Name: SES_SENDER_EMAIL
              Value: noreply@aerolink.com
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPool
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoUserPoolClient
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref NotificationServiceLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8008/health'')"']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

