    Properties:
      Name: !Sub '${EnvironmentName}-pricing-recalculation-schedule'
      ScheduleExpression: 'rate(5 minutes)'
      State: ENABLED
      Targets:
        - Id: pricing-lambda
          Arn: !GetAtt PricingRecalculationFunction.Arn

  # ============================================================
  # SQS Queues
  # ============================================================
  NotificationsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${EnvironmentName}-aerolink-notifications-dlq'
      MessageRetentionPeriod: 1209600

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${EnvironmentName}-aerolink-notifications'
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationsDLQ.Arn
        maxReceiveCount: 3

  NotificationsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !GetAtt BookingCreatedRule.Arn
                  - !GetAtt PaymentCompletedRule.Arn
                  - !GetAtt PaymentFailedRule.Arn
                  - !GetAtt PaymentRefundedRule.Arn
                  - !GetAtt CheckInCompletedRule.Arn
                  - !GetAtt BaggageStatusChangedRule.Arn
                  - !GetAtt BaggageRegisteredRule.Arn
                  - !GetAtt BookingCancelledRule.Arn
                  - !GetAtt FlightScheduleUpdatedRule.Arn
                  - !GetAtt SeatAvailabilityChangedRule.Arn

  # ============================================================
  # S3 Bucket
  # ============================================================
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${EnvironmentName}-aerolink-documents-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled   # versioning required for cross-region replication
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionBoardingPassesToIA
            Prefix: boarding-passes/
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
      ReplicationConfiguration: !If
        - IsPrimary
        - Role: !GetAtt S3ReplicationRole.Arn
          Rules:
            - Id: ReplicateAllToSecondary
              Status: Enabled
              Filter:
                Prefix: ''
              Destination:
                Bucket: !Sub 'arn:aws:s3:::${EnvironmentName}-aerolink-documents-replica-${AWS::AccountId}'
                StorageClass: STANDARD_IA
                ReplicationTime:
                  Status: Enabled
                  Time:
                    Minutes: 15
                Metrics:
                  Status: Enabled
                  EventThreshold:
                    Minutes: 15
              DeleteMarkerReplication:
                Status: Enabled
        - !Ref AWS::NoValue

  # ============================================================
  # DynamoDB
  # ============================================================
  PaymentIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: payment-idempotency
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ============================================================
  # Lambda Functions
  # ============================================================

  # --- Lambda 0: Cognito Post-Confirmation Trigger ---
  # Auto-assigns every newly confirmed user to the 'passenger' group so that
  # cognito:groups is always present in their ID token for RBAC.
  CognitoPostConfirmationTrigger:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-cognito-post-confirmation'
      Runtime: python3.10
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import boto3
          import os

          def handler(event, context):
              if event.get('triggerSource', '') in (
                  'PostConfirmation_ConfirmSignUp',
                  'PostConfirmation_ConfirmForgotPassword',
              ):
                  client = boto3.client('cognito-idp', region_name=os.environ.get('AWS_DEFAULT_REGION', 'us-east-1'))
                  try:
                      client.admin_add_user_to_group(
                          UserPoolId=event['userPoolId'],
                          Username=event['userName'],
                          GroupName='passenger',
                      )
                  except client.exceptions.ResourceNotFoundException:
                      pass  # group not yet created during stack bootstrap
              return event
      Environment:
        Variables:
          AWS_DEFAULT_REGION: !Ref 'AWS::Region'

  CognitoPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CognitoPostConfirmationTrigger.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt CognitoUserPool.Arn

  # --- Lambda 1: Notification Dispatch (SQS-triggered) ---
  NotificationDispatchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-notification-dispatch'
      Runtime: python3.10
      Handler: handler.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/notification_dispatch.zip
      Environment:
        Variables:
          AWS_DEFAULT_REGION_OVERRIDE: !Ref 'AWS::Region'
      LoggingConfig:
        LogGroup: !Ref NotificationDispatchLogGroup

  NotificationDispatchEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref NotificationDispatchFunction
      EventSourceArn: !GetAtt NotificationsQueue.Arn
      BatchSize: 10
      Enabled: false  # notification-service ECS task polls SQS directly; Lambda trigger disabled to avoid double-processing

  # --- Lambda 2: Boarding Pass Generator (EventBridge-triggered) ---
  BoardingPassGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-boarding-pass-generator'
      Runtime: python3.10
      Handler: handler.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/boarding_pass_generator.zip
      Environment:
        Variables:
          S3_BUCKET: !Ref DocumentsBucket
          AWS_DEFAULT_REGION_OVERRIDE: !Ref 'AWS::Region'
      LoggingConfig:
        LogGroup: !Ref BoardingPassGeneratorLogGroup

  BoardingPassLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BoardingPassGeneratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CheckInCompletedRule.Arn

  # --- Lambda 3: Pricing Recalculation (scheduled, VPC-attached) ---
  PricingRecalculationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-pricing-recalculation'
      Runtime: python3.10
      Handler: handler.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/pricing_recalculation.zip
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          DB_HOST: !GetAtt DBInstance.Endpoint.Address
          DB_PORT: !GetAtt DBInstance.Endpoint.Port
          DB_NAME: aerolink
          DB_USER: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
      LoggingConfig:
        LogGroup: !Ref PricingRecalculationLogGroup

  PricingRecalculationLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PricingRecalculationFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PricingRecalculationScheduleRule.Arn

  # ============================================================
  # SeatAvailabilityChanged EventBridge rule (audit fix)
  # ============================================================
  SeatAvailabilityChangedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${EnvironmentName}-seat-availability-to-notifications'
      EventBusName: !Ref AerolinkEventBus
      EventPattern:
        source:
          - flight-service
        detail-type:
          - SeatAvailabilityChanged
      Targets:
        - Id: notification-queue
          Arn: !GetAtt NotificationsQueue.Arn

  # ============================================================
  # Application Auto Scaling — CPU-based target tracking for all services
  # ============================================================
  AutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ecs-autoscaling-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole

  # Macro to avoid repeating the target/policy pair 9 times — one block per service:

  APIGatewayScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: APIGatewayService
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub 'service/${ECSCluster}/api-gateway'
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref ECSMinCapacity
      MaxCapacity: !Ref ECSMaxCapacity
      RoleARN: !GetAtt AutoScalingRole.Arn

  APIGatewayScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-api-gateway-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref APIGatewayScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  AuthServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: AuthService
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub 'service/${ECSCluster}/auth-service'
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref ECSMinCapacity
      MaxCapacity: !Ref ECSMaxCapacity
      RoleARN: !GetAtt AutoScalingRole.Arn

  AuthServiceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-auth-service-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AuthServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  FlightServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: FlightService
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub 'service/${ECSCluster}/flight-service'
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref ECSMinCapacity
      MaxCapacity: !Ref ECSMaxCapacity
      RoleARN: !GetAtt AutoScalingRole.Arn

  FlightServiceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-flight-service-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref FlightServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  BookingServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: BookingService
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub 'service/${ECSCluster}/booking-service'
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref ECSMinCapacity
      MaxCapacity: !Ref ECSMaxCapacity
      RoleARN: !GetAtt AutoScalingRole.Arn

  BookingServiceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-booking-service-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BookingServiceScalableTarget
