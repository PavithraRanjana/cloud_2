  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "8008:8008"
    environment:
      - SERVICE_NAME=notification-service
      - DATABASE_URL=postgresql+asyncpg://aerolink:aerolink@postgres:5432/aerolink
      - AWS_ENDPOINT_URL=http://localstack:4566
      - REDIS_URL=redis://redis:6379/7
      - ENABLE_SQS_POLLING=true
      - SES_SENDER_EMAIL=noreply@aerolink.com
    env_file:
      - path: ./infrastructure/localstack/cognito.env
        required: false
    depends_on:
